<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Lunch Money</title>
<style>
	html, body { margin: 0; height: 100%; background: #000000; overflow: hidden; }
	body { display: flex; align-items: center; justify-content: center; }
	canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
</style>
</head>
<body>
<canvas id="view" width="640" height="360"></canvas>
<script src="js/utils.js"></script>
<script src="js/sprites.js"></script>
<script src="js/draw.js"></script>
<script src="js/collision.js"></script>
<script src="js/movers.js"></script>
<script src="js/objects.js"></script>
<script src="js/input.js"></script>
<script src="js/char_side.js"></script>
<script src="js/char_topd.js"></script>
<script src="js/camera.js"></script>
<script src="js/world.js"></script>
<script src="js/game.js"></script>
<script>
	// scale the canvas up by the largest whole number that fits the window
	const view = document.getElementById("view");
	function fit() {
		const s = Math.max(1, Math.floor(Math.min(window.innerWidth / DISPLAY_W, window.innerHeight / DISPLAY_H)));
		view.style.width = (DISPLAY_W * s) + "px";
		view.style.height = (DISPLAY_H * s) + "px";
	}
	window.addEventListener("resize", fit);
	fit();
	Shell.start(view);
</script>
</body>
</html>
